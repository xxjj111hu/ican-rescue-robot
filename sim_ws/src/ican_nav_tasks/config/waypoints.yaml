# 顺序导航任务参数（两段导航：识别位 → 进入位）
#
# 每个任务点走两段：
#   ① standoff（识别位）：贴图前方约 0.70 m、车头朝贴图 —— 相机在这里能拍到地面图
#   ② point（进入位）：贴图中心 = 任务点本身 —— 判分细则 §（5）要求"完全进入任务点内"
#
# 坐标来源：
#   standoff 来自识别模块 goto_pose.py 的 STANDOFF_POSES
#     （已用地图占据栅格校验，0.25 m 半径内无占据，实测停车误差 2~4 cm）
#   point 即场地贴图中心坐标（与 land_shoot.world 一致）
#
# 人眼可读对照表：
#   点位   standoff (x, y, yaw)          point (x, y, yaw)         进入点位后车头正对
#   1     (0.031, -0.660, -1.5708)      (0.031, -1.360,  0.0000)   ①环形靶 (1.575,-1.35)
#   2     (0.027, -2.000, -1.5708)      (0.027, -2.700,  0.0000)   ②旋转靶 (1.575,-2.70)
#   3     (0.420, -1.914,  0.0000)      (1.120, -1.914, -1.5708)   ③移动靶 (1.125,-2.97)
#   4     (0.420, -0.785,  0.0000)      (1.120, -0.785,  1.5708)   ④移动靶 (1.125, 0.27)
#
# ⚠️ 点位 3 的进入位 yaw 必须是 **-1.5708（车头朝 -y）**，不是 +1.5708：
#    点位 3 位于两个移动靶正中间（到靶3 与靶4 都是 1.055 m），
#    靶3 在 -y 方向、靶4 在 +y 方向。若朝 +y，车头对着的是"靶4"——
#    那是点位 4 该打的目标，会按细则 §1.3(3)「首击锁定」错误锁死点位 3 的成绩。
#    坐标依据：land_shoot.world 里 target_moving_3 pose=(1.125, -2.97, 0.26)。
#
# 注意：下面是 ROS 2 参数格式（扁平数组，每 3 个数一组 x,y,yaw），
#       改坐标时请同时更新上面的对照表，避免两边不一致。

/sequential_mission_node:
  ros__parameters:
    use_sim_time: true

    # 进入位（贴图中心）：[x, y, yaw] × 4
    # ⚠️ 点位3 的 yaw = -1.5708（车头朝 -y 正对移动靶3）；写成 +1.5708 会对着靶4
    waypoints: [
        0.031, -1.360,  0.0,
        0.027, -2.700,  0.0,
        1.120, -1.914, -1.5708,
        1.120, -0.785,  1.5708,
    ]

    # 识别位（贴图前方 0.70 m、车头朝贴图）：[x, y, yaw] × 4
    # 留空 [] 则跳过识别位，退化为原来的单段导航
    standoff_waypoints: [
        0.031, -0.660, -1.5708,
        0.027, -2.000, -1.5708,
        0.420, -1.914,  0.0,
        0.420, -0.785,  0.0,
    ]

    # 指挥中心（返航与停车目标）
    base_xyyaw: [0.0, 0.0, 0.0]
    return_to_base: true

    # ---- 识别等待 ----
    # 停在识别位后最多等这么久的话术；超时也继续进入点位，保证全程不中断
    recognize_wait_sec: 8.0
    detections_topic: /referee/detections
    recognize_status_topic: /ican_recognize/status

    # ---- 裁判系统话题（判分硬要求）----
    referee_target_topic: /referee/current_target   # shoot_1 … shoot_4
    referee_finish_topic: /referee/finish           # finish:return_start
    finish_message: "finish:return_start"

    # ---- 导航与停车容差（实测标定）----
    xy_tol: 0.15
    yaw_tol: 0.12
    park_tol: 0.15
    nav_timeout_sec: 120.0
    goal_retry_sec: 2.0
    start_delay_sec: 20.0
    settle_sec: 2.0
    nudge_speed: 0.1
    nudge_max_sec: 12.0

    # ---- 进点前爬 + 微调对位（位置分 = 射击瞬间车头与任务点重叠率×10）----
    # 前爬：进点后朝「任务点坐标」方向直行指定距离（米），1/4 号点爬、2/3 号点对照
    creep_forward_m_list: [0.10, 0.0, 0.0, 0.05]
    # 微调对位（必做，不依赖前爬）：把车头压到任务点中心，残差压到 fine_tol 内
    fine_tol: 0.05
    fine_timeout_sec: 8.0

    # ---- 停滞检测（对应官网比赛流程「机器人超过 30s 状态未变化，裁判可停赛」）----
    # 导航中剩余距离在 stall_check_sec 内改善不足 stall_improve_m 即判定卡住：
    # 取消目标 → 低速微调脱困 recover_sec 秒 → 重发目标。
    # 同一目标最多自救 max_stall_recover 次，仍失败则按到达处理继续（优先保全程不中断）。
    stall_check_sec: 15.0
    stall_improve_m: 0.05
    recover_sec: 6.0
    max_stall_recover: 3

    # 射击：瞄准算法（D-01）尚未接入，默认关闭，只发 shoot_N 声明不实弹
    # 说明：细则规定"命中第一发后该点不再计分"，胡乱射击可能锁死错误成绩
    enable_shooting: false

    event_topic: /mission/event
    navigate_action: /navigate_to_pose
    cmd_vel_topic: /cmd_vel
    fire_service: /shooter/shoot

/speed_monitor_node:
  ros__parameters:
    use_sim_time: true
    topic: /cmd_vel
    max_linear_speed: 0.5
    summary_period_sec: 30.0
    report_file: ""          # 留空则不写文件（原为个人绝对路径）
