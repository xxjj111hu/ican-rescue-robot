# 识别节点参数（B-03/B-05 补全）
# 用法：
#   ros2 run ican_recognize recognize_node --ros-args --params-file <本文件>
#   ros2 launch ican_recognize recognize.launch.py
#
# 模型准备（只需一次）：
#   mkdir -p ~/.ros/ican_recognize
#   cp 交付包/识别/模型/best.pt ~/.ros/ican_recognize/best.pt

/ican_recognize_node:
  ros__parameters:
    # ---- 模型 ----
    mode: yolo                      # yolo | classifier（classifier 需 runs_cls/best.pt）
    model_path: ~/.ros/ican_recognize/best.pt
    cls_model_path: ~/.ros/ican_recognize/best.pt
    imgsz: 640
    conf_thres: 0.20
    iou_thres: 0.45

    # ---- 话题 ----
    image_topic: /camera/image
    odom_topic: /odom
    detections_topic: /referee/detections
    result_topic: /detection/result
    status_topic: /ican_recognize/status
    # 射击靶位：发布「识别类别 -> 该打哪个靶」的结构化结果（判分细则表 7）
    #   {"class","rotate_target","moving_target","conf","point","dist","source","script"}
    target_topic: /ican_recognize/target
    debug_image_topic: /ican_recognize/debug_image
    publish_result: true
    publish_status: true

    # ---- 调试图（默认关闭！）----
    # 实测：开启调试图后每帧多花约 127 ms，整体频率从 25 Hz 掉到 7 Hz。
    # 原因：每帧复制 800x800x3（1.9MB）图像 + cv2 画框 + tobytes + rclpy 序列化发布。
    # 平时保持 false；需要肉眼检查时置 true，并用 debug_every 降频（每 N 帧发一次）。
    publish_debug_image: false
    debug_every: 10

    # ---- 多帧投票 ----
    vote_window: 7
    vote_min: 4
    min_conf_publish: 0.45
    min_publish_interval: 2.0

    # ---- 每类阈值覆盖（默认不做覆盖）----
    # 依据《判分细则》§1.3：识别失败时该点到达分为 0，且射击也不计分；
    # 而「发错」与「不发」得分完全相同（都是 0）。
    # 所以抬高阈值"宁可不发"没有任何计分收益，只会放弃"猜对拿 10 分"的机会。
    # 如需实验性放宽/收紧，格式："类名:阈值,类名:阈值"
    class_min_conf: ""

    # ---- 距离门控（关键）----
    # 窗口由实测标定，见 交付包/识别/鲁棒性测试报告.md「门控实测」一节：
    #   0.6m 2/5、0.7m 3/5、0.8m 15/15、0.9m 4/5、1.1m 3/5、1.4m 2/5
    # 停车位在 0.70m，取 [0.60, 0.90] 使下界留 10cm、上界留 20cm 余量。
    gate_enable: true
    gate_min_dist: 0.60
    gate_max_dist: 0.90

    # ---- 超时兜底 ----
    # 窗口内持续该时长仍无法正常发布 → 强制发布当前最优猜测（投票结果或最高置信度单帧）。
    # 理由：发错与不发都是 0 分，赌对了能拿 10 分并保住该点射击分。
    detect_timeout_sec: 5.0
    force_publish_on_timeout: true

    fps_log_every: 30
    status_log_every: 5.0
